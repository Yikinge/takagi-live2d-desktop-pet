name: Publish migrated v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      MAC_ASSET: Takagi-Live2D-Desktop-Pet_0.1.0_macos-arm64.zip
      WINDOWS_ASSET: Takagi-Live2D-Desktop-Pet_0.1.0_windows-x64-setup.exe
      MAC_SHA256: e4e7bc0ba2082689f19b59f27a0df55cf1fa2ef47013d328adeec456f168e60f
      WINDOWS_SHA256: 3d8ae601535f728297786e2a9c32086ac0bf89dcf65560e4e1509aa953c29068
    steps:
      - name: Download and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/1819674377wy-rgb/takagi-live2d-desktop-pet/releases/download/v0.1.0"
          curl --fail --location --retry 3 "$base_url/$MAC_ASSET" --output "$MAC_ASSET"
          curl --fail --location --retry 3 "$base_url/$WINDOWS_ASSET" --output "$WINDOWS_ASSET"
          printf '%s  %s\n' "$MAC_SHA256" "$MAC_ASSET" | sha256sum --check --strict
          printf '%s  %s\n' "$WINDOWS_SHA256" "$WINDOWS_ASSET" | sha256sum --check --strict
          printf '%s  %s\n' "$MAC_SHA256" "$MAC_ASSET" > SHA256SUMS.txt
          printf '%s  %s\n' "$WINDOWS_SHA256" "$WINDOWS_ASSET" > SHA256SUMS-windows.txt

      - name: Create release and upload assets
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            printf '%s\n' \
              '高木同学 Live2D 桌宠首个公开版本。' \
              '' \
              '支持 macOS Apple Silicon 与 Windows 10/11 x64。' \
              '包含透明桌宠窗口、鼠标穿透、眼球追踪、眨眼、键鼠手臂交互和按键气泡。' \
              '' \
              '本项目为非商业同人项目，角色相关权利归原作者及版权方所有。' \
              | gh release create v0.1.0 --title '高木同学 Live2D 桌宠 v0.1.0' --notes-file -
          fi
          gh release upload v0.1.0 \
            "$MAC_ASSET" \
            "$WINDOWS_ASSET" \
            SHA256SUMS.txt \
            SHA256SUMS-windows.txt \
            --clobber

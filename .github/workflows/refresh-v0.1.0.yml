name: Refresh v0.1.0 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-v0.1.0.yml

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Build macOS application
        run: npm run desktop:build

      - name: Package macOS asset
        shell: bash
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/高木同学桌宠.app" \
            "release-assets/Takagi-Live2D-Desktop-Pet_0.1.0_macos-arm64.zip"
          cd release-assets
          shasum -a 256 "Takagi-Live2D-Desktop-Pet_0.1.0_macos-arm64.zip" > SHA256SUMS.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Windows 10/11 x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Build Windows installer
        run: npm run desktop:build:windows

      - name: Package Windows asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows NSIS installer was not generated."
          }
          $target = "release-assets/Takagi-Live2D-Desktop-Pet_0.1.0_windows-x64-setup.exe"
          Copy-Item $installer.FullName $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Takagi-Live2D-Desktop-Pet_0.1.0_windows-x64-setup.exe" |
            Out-File "release-assets/SHA256SUMS-windows.txt" -Encoding utf8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Replace v0.1.0 assets
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          test -s release-assets/Takagi-Live2D-Desktop-Pet_0.1.0_macos-arm64.zip
          test -s release-assets/Takagi-Live2D-Desktop-Pet_0.1.0_windows-x64-setup.exe
          test -s release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS-windows.txt

      - name: Replace existing Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload v0.1.0 release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

name: Build Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows 10/11 x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend and Rust tests
        run: npm run verify

      - name: Build Windows NSIS installer
        run: npm run desktop:build:windows

      - name: Generate SHA-256 checksum
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows NSIS installer was not generated."
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File "src-tauri/target/release/bundle/nsis/SHA256SUMS-windows.txt" -Encoding ascii
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: takagi-desktop-pet-0.1.0-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14
